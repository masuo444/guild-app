<!doctype html>
<html><head><meta charset="utf-8"><title>maps debug</title></head>
<body style="margin:0;font:13px monospace">
<div id="a" style="width:560px;height:340px;background:#eee"></div>
<pre id="log"></pre>
<script>
const L = (s) => { document.getElementById('log').textContent += s + "\n"; };
window.gm_authFailure = () => L('*** gm_authFailure ***');
window.initMap = async () => {
  const { Map } = await google.maps.importLibrary('maps');
  const m = new Map(document.getElementById('a'), { center: { lat: 35.68, lng: 139.65 }, zoom: 5, mapId: 'DEMO_MAP_ID' });
  const t0 = Date.now();
  google.maps.event.addListener(m, 'idle', () => L('idle @' + (Date.now() - t0) + 'ms'));
  google.maps.event.addListener(m, 'tilesloaded', () => L('tilesloaded @' + (Date.now() - t0) + 'ms'));
  const iv = setInterval(() => {
    if (document.querySelectorAll('.gm-style').length) { L('gm-style @' + (Date.now() - t0) + 'ms'); clearInterval(iv); }
  }, 500);
  setTimeout(() => { clearInterval(iv); L('watch end: gm-style=' + document.querySelectorAll('.gm-style').length); }, 60000);
};
const key = new URLSearchParams(location.search).get('key') || '';
const s = document.createElement('script');
s.async = true;
s.src = 'https://maps.googleapis.com/maps/api/js?key=' + encodeURIComponent(key) + '&language=ja&loading=async&callback=initMap';
document.body.appendChild(s);
</script>
</body></html>
