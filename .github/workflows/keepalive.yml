name: Supabase keepalive

# Supabase 無料プランの自動一時停止（7日無操作）を防ぐ。
# Vercel Cron（毎日）に加えた二重化。失敗すると GitHub がリポジトリ所有者にメール通知する。
on:
  schedule:
    - cron: '17 */6 * * *'   # 6時間ごと（UTC）
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping keepalive endpoint
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            body=$(curl -sS -m 30 -H "Authorization: Bearer $CRON_SECRET" \
              "https://guild-app.fomusglobal.com/api/cron/keepalive?source=github-actions" || true)
            echo "attempt $attempt: $body"
            if echo "$body" | grep -q '"ok":true'; then
              exit 0
            fi
            sleep 60
          done
          echo "::error::Supabase keepalive failed 3 times — check https://supabase.com/dashboard/project/lszppreokxzuadxixfax"
          exit 1
